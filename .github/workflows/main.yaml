name: Build and Release Book

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: book_instruction_for_a_door.tex
          texlive_version: "2025"
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.6"

      - name: Prepare LaTeX for HTML
        run: |
          python3 - << 'PY'
          from pathlib import Path
          src = Path("book_instruction_for_a_door.tex").read_text(encoding="utf-8")
          out = []
          skipping = False
          for line in src.splitlines(True):
              if "HTML-SKIP-BEGIN" in line:
                  skipping = True
                  continue
              if "HTML-SKIP-END" in line:
                  skipping = False
                  continue
              if not skipping:
                  out.append(line)
          Path("build").mkdir(exist_ok=True)
          Path("build/book_for_html.tex").write_text("".join(out), encoding="utf-8")
          PY

      - name: Generate HTML
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            OUT="book_instruction_for_a_door.html"
          else
            OUT="book_instruction_for_a_door-${GITHUB_REF_NAME}.html"
          fi
          pandoc build/book_for_html.tex \
            --from=latex \
            --to=html5 \
            --standalone \
            --template=web/template.html \
            --toc \
            --toc-depth=2 \
            --section-divs \
            --metadata title="Instruction for a Door" \
            --metadata author="Vladimir Sumarov" \
            --metadata date="2026" \
            --metadata subtitle="A fictional self-help book. The instructions are not advice." \
            --metadata lang="en" \
            -o "$OUT"
          test -s "$OUT"
          echo "HTML_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Stage versioned PDF
        if: startsWith(github.ref, 'refs/tags/')
        run: cp book_instruction_for_a_door.pdf "book_instruction_for_a_door-${GITHUB_REF_NAME}.pdf"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ github.ref_name }}
          path: |
            book_instruction_for_a_door.pdf
            book_instruction_for_a_door*.html
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Instruction for a Door ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            book_instruction_for_a_door-${{ github.ref_name }}.pdf
            book_instruction_for_a_door-${{ github.ref_name }}.html
          body: |
            ${{ github.ref_name }} of *Instruction for a Door*.

            Built from `book_instruction_for_a_door.tex`.

            - `book_instruction_for_a_door-${{ github.ref_name }}.pdf` — 6×9 PDF
            - `book_instruction_for_a_door-${{ github.ref_name }}.html` — single-file HTML

            Push another `v*` tag on `master` to cut the next release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
